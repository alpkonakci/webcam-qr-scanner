name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: Desktop (Windows)
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.14'
      - name: Create isolated test environment
        run: python -m venv .venv
      - name: Install pinned requirements and source-compatible CA bundle
        run: .\.venv\Scripts\python.exe -m pip install -r requirements-dev.txt -c requirements-ci-constraints.txt
      - name: Check dependency consistency
        run: .\.venv\Scripts\python.exe -m pip check
      - name: Run complete desktop suite
        run: .\.venv\Scripts\python.exe -m unittest discover -s tests

  web:
    name: Web (build, tests, lint, types)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    defaults:
      run:
        working-directory: pwa
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: pwa/package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Production build and complete web suite
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Typecheck generated routes and application
        run: npm run typecheck

  retention:
    name: Retention SQL (disposable PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17@sha256:c469d92cbb89e123ba7c2c7c1a8815572943584085c37b007bacb43150a8c9e4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: wqrs-ci-only
          POSTGRES_DB: wqrs_retention_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d wqrs_retention_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: wqrs-ci-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Verify local SQL client
        run: psql --version
      - name: Test operation scripts against disposable SQL fixtures
        run: node scripts/check_retention_schedule.mjs --postgres
